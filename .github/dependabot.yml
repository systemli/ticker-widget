---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      stencil:
        patterns:
          - "@stencil/core"
          - "date-fns"
          - "linkify-html"
          - "linkifyjs"
      development:
        patterns:
          - "@types/jest"
          - "@types/node"
          - "jest"
          - "jest-*"
          - "puppeteer"
    ignore:
      # stencil test (jest 29-based) rejects newer major jest versions; see
      # https://github.com/systemli/ticker-widget/pull/84
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-cli"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      # keep @types/node aligned with the Node 24 engine (.nvmrc)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
